# PROVISIONAL 6-state EKF parameters — development only, NOT tuned.
# Tuning must use calibration runs only (never evaluation runs).
ekf:
  status: provisional
  # process noise densities (per second)
  q_xy: 1.0e-6            # kinematics are exact in sim; small model slack
  q_theta: 1.0e-6
  q_v: 1.0                # teleop changes speed almost instantly (accel up to ~9 m/s^2)
  q_w: 0.1               # 1.0 let skid errors leak into the bias via wheel yaw rate (dev grid)
  q_b: 1.0e-8             # gyro bias random walk (bias is ~constant in sim)
  k_v_slip: 50.0          # Q inflation by P_slip (unused until the LSTM provides P_slip)
  k_w_slip: 50.0
  # measurement noise (variances)
  r_odom_v: 2.5e-3        # (0.05 m/s)^2 — model error (skid/slip), not sensor noise
  r_odom_w: 1.0e-2        # (0.1 rad/s)^2 — wheel yaw rate is wrong while turning (skid)
  r_gyro: 7.6e-5          # (0.00873 rad/s)^2 from the SDF
  r_zupt: 1.0e-6          # (0.001 m/s)^2, scaled by detector R(c)
  r_zaru: 1.0e-6          # (0.001 rad/s)^2, scaled by detector R(c)
  # initial uncertainty (std)
  p0_xy: 0.01
  p0_theta: 0.01
  p0_v: 0.1
  p0_w: 0.1
  p0_b: 0.02
